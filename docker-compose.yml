services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: petshop
      POSTGRES_DB: petshop
    # 5433 en el host: evita el choque con un PostgreSQL instalado en el sistema (5432).
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petshop -d petshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    # Solo desarrollo: migra, carga el seed demo (idempotente) y arranca con recarga.
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed_demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    environment:
      ENV: dev
      DATABASE_URL: postgresql://petshop:petshop@db:5432/petshop
      REDIS_URL: redis://redis:6379/0
      # Valores de prueba SOLO para desarrollo local; nunca usar en un entorno real.
      SECRET_KEY: dev-only-secret-key-not-for-production
      CORS_ORIGINS: http://localhost:5173
      SEED_OWNER_PASSWORD: demo-duena-2026
      SEED_MOSTRADOR_PASSWORD: demo-mostrador-2026
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules propios del contenedor (binarios de Linux, no los de Windows).
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:8000
      # File watching fiable sobre bind mounts de Windows.
      VITE_USE_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
